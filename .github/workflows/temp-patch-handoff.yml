name: Cleanup Temporary APK Handoff

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-patch-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary public release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete chat-handoff-v1.0.27 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
