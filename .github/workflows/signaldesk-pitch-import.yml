name: SignalDesk Pitch Import

on:
  push:
    paths:
      - .github/workflows/signaldesk-pitch-import.yml

permissions:
  contents: write

jobs:
  import-pitch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rendered pitch
        run: |
          mkdir -p panta-signaldesk/assets
          curl --fail --location --retry 3 --output panta-signaldesk/assets/signaldesk-pitch.mp4 \
            https://sb-5v0jclkrkh6g.vercel.run/SignalDesk-pitch.mp4
          test $(stat -c%s panta-signaldesk/assets/signaldesk-pitch.mp4) -gt 3000000
      - name: Commit pitch video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panta-signaldesk/assets/signaldesk-pitch.mp4
          git commit -m "Add SignalDesk hackathon pitch video"
          git push
